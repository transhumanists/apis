name: Pipeline (scrape → score → post → commit)

on:
  schedule:
    # One run per day: the router's free tier is OpenRouter's 50-free-
    # requests/day allowance (account below the $10 funding threshold).
    # With 5 articles + retries, leaves ~35 req headroom in 50 req/day free tier.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Max articles to score (default 5, max 15 to fit OpenRouter free tier)'
        required: false
        default: '5'
        type: string
  repository_dispatch:
    types: [run-scrape]

concurrency:
  group: pipeline-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scrape:
    name: RSS scrape
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt --quiet

      - name: Run RSS fetcher
        run: python scrapers/rss_fetcher.py

      - name: Run self-healer
        run: python self_healer/source_checker.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scraped-data
          path: |
            data/articles.json
            data/feeds_health.json
            data/dead_feeds.json
          if-no-files-found: error

  score:
    name: LLM scoring
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download scraped data
        uses: actions/download-artifact@v8
        with:
          name: scraped-data
          path: data

      - name: Save previous milestones for delta
        env:
          GH_TOKEN: ${{ secrets.MILESTONES_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -sSL --max-time 30 -H "Authorization: token $GH_TOKEN" \
            "https://raw.githubusercontent.com/transhumanists/milestones/main/data/milestones.json" \
            -o data/milestones_existing.json || echo '{"categories":{}}' > data/milestones_existing.json

      - name: Set up LLM router
        id: llm-router
        uses: neohiro/llm-action@v1
        with:
          llm-router-enabled: ${{ vars.LLM_ROUTER_ENABLED || 'true' }}
          llm-model: ${{ vars.LLM_MODEL || 'gpt-4o' }}
          openai-key: ${{ secrets.OPENAI_API_KEY }}
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          groq-key: ${{ secrets.GROQ_API_KEY }}
          cerebras-key: ${{ secrets.CEREBRAS_API_KEY }}
          sambanova-key: ${{ secrets.SAMBANOVA_API_KEY }}
          github-models-key: ${{ secrets.GITHUB_MODELS_API_KEY }}
          cloudflare-key: ${{ secrets.CLOUDFLARE_API_KEY }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          openrouter-key: ${{ secrets.OPENROUTER_API_KEY }}
          google-ai-key: ${{ secrets.GOOGLE_AI_API_KEY }}
          huggingface-key: ${{ secrets.HUGGINGFACE_API_KEY }}
          nvidia-key: ${{ secrets.NVIDIA_API_KEY }}
          cohere-key: ${{ secrets.COHERE_API_KEY }}
          together-key: ${{ secrets.TOGETHER_API_KEY }}
          data-dir: ${{ runner.temp }}/llm-router-data
          python-version: '3.12'
          cache-pip: false

      - name: Install consumer dependencies
        # llm-action's setup-python changes the interpreter on PATH, so install
        # with THAT python (the one that runs score_milestone.py below).
        run: python -m pip install -r requirements.txt --quiet

      - name: Run scoring
        # The router here is repo-owned (llm/router.py + data/*.json); the
        # llm-action above only bundles its own upstream data into runner.temp
        # and exports the provider API keys. Router candidates are gated on
        # which of those keys are actually present.
        env:
          MAX_ARTICLES_TO_SCORE: ${{ github.event.inputs.max_articles || '5' }}
        run: python llm/score_milestone.py

      - name: Guard against publishing an empty dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/milestones.json")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:  # noqa: BLE001
              print(f"::error::Cannot read milestones.json after scoring: {exc}")
              raise SystemExit(1)
          count = sum(len(cat.get("milestones", [])) for cat in data.get("categories", {}).values())
          if count < 1:
              print(f"::error::Scoring produced 0 milestones ({count}). Refusing to publish an empty dataset - the milestone database would be wiped.")
              raise SystemExit(1)
          print(f"OK: publishing {count} milestones")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: scored-data
          path: |
            data/milestones.json
            data/events.json
            Milestones.md
          if-no-files-found: error

  post-facebook:
    name: Post to Facebook
    needs: score
    if: ${{ vars.FACEBOOK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install requests --quiet

      - uses: actions/download-artifact@v8
        with:
          name: scored-data
          path: data

      - name: Post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python social/facebook_poster.py

  commit-milestones:
    name: Commit to transhumanists/milestones
    needs: score
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: transhumanists/milestones
          token: ${{ secrets.MILESTONES_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main

      - uses: actions/download-artifact@v8
        with:
          name: scored-data
          path: .

      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.MILESTONES_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "transhumanists-bot"
          git config user.email "bot@transhumanists.github.io"
          git add data/ Milestones.md
          if git diff --cached --quiet; then
            echo "No milestone changes"
            exit 0
          fi
          ts=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          git commit -m "chore(milestones): auto-update ${ts}"
          git push

  commit-site:
    name: Commit to transhumanists.github.io
    needs: score
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: transhumanists/transhumanists.github.io
          token: ${{ secrets.MILESTONES_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main

      - uses: actions/download-artifact@v8
        with:
          name: scored-data
          path: data

      - name: Generate activity
        env:
          GH_TOKEN: ${{ secrets.MILESTONES_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python github/dashboard_updater.py

      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.MILESTONES_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "transhumanists-bot"
          git config user.email "bot@transhumanists.github.io"
          if git diff --quiet data/; then
            echo "No site data changes"
            exit 0
          fi
          git add data/
          ts=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          git commit -m "chore(dashboard): auto-update ${ts}"
          git push
