name: Pipeline (scrape → score → post → commit)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-scrape]

jobs:
  scrape:
    name: RSS scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt --quiet

      - name: Run RSS fetcher
        run: python scrapers/rss_fetcher.py

      - name: Run self-healer
        run: python self_healer/source_checker.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data
          path: |
            data/articles.json
            data/feeds_health.json
            data/dead_feeds.json
          if-no-files-found: warn

  score:
    name: LLM scoring
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt --quiet

      - name: Download scraped data
        uses: actions/download-artifact@v4
        with:
          name: scraped-data
          path: data

      - name: Save previous milestones for delta
        run: |
          curl -sSL -H "Authorization: token $GITHUB_TOKEN" \
            "https://raw.githubusercontent.com/transhumanists/milestones/main/data/milestones.json" \
            -o data/milestones_existing.json || echo '{"categories":{}}' > data/milestones_existing.json

      - name: Score milestones
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o' }}
        run: python llm/score_milestone.py

      - uses: actions/upload-artifact@v4
        with:
          name: scored-data
          path: |
            data/milestones.json
            data/events.json
            Milestones.md

  post-facebook:
    name: Post to Facebook
    needs: score
    if: ${{ vars.FACEBOOK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests --quiet

      - uses: actions/download-artifact@v4
        with:
          name: scored-data
          path: data

      - name: Post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python social/facebook_poster.py

  commit-milestones:
    name: Commit to transhumanists/milestones
    needs: score
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: transhumanists/milestones
          token: ${{ secrets.MILESTONES_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: scored-data
          path: data

      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.MILESTONES_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "transhumanists-bot"
          git config user.email "bot@transhumanists.github.io"
          git add data/ Milestones.md
          if git diff --cached --quiet; then
            echo "No milestone changes"
            exit 0
          fi
          ts=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          git commit -m "chore(milestones): auto-update ${ts}"
          git push

  commit-site:
    name: Commit to transhumanists.github.io
    needs: score
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: transhumanists/transhumanists.github.io
          token: ${{ secrets.MILESTONES_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: scored-data
          path: data

      - name: Generate activity
        run: |
          python github/dashboard_updater.py || true

      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.MILESTONES_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "transhumanists-bot"
          git config user.email "bot@transhumanists.github.io"
          if git diff --quiet data/; then
            echo "No site data changes"
            exit 0
          fi
          git add data/
          ts=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          git commit -m "chore(dashboard): auto-update ${ts}"
          git push
